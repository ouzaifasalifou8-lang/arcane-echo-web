<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcane Echo Web - Expert</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 20px; background: #1a1a1a; color: white; }
        #chat-container { max-width: 600px; margin: auto; background: #2d2d2d; padding: 25px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        textarea { width: 100%; height: 100px; background: #3d3d3d; color: white; border: 1px solid #555; border-radius: 8px; padding: 12px; box-sizing: border-box; margin-bottom: 15px; }
        .button-group { display: flex; gap: 10px; }
        button { flex: 3; padding: 12px; background: #007bff; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        #mic-btn { flex: 1; background: #28a745; font-size: 1.2rem; }
        #output { margin-top: 20px; padding: 15px; background: #3d3d3d; border-left: 4px solid #007bff; border-radius: 4px; min-height: 50px; }
        .status { font-size: 0.8rem; color: #aaa; margin-top: 5px; }
    </style>
</head>
<body>
    <div id="chat-container">
        <h2>Arcane Echo - Expert Tech</h2>
        <textarea id="input" placeholder="Posez une question technique (ex: ESP32, Python...)"></textarea>
        <div class="button-group">
            <button id="generate-btn">Analyser / Répondre</button>
            <button id="mic-btn">🎤</button>
        </div>
        <div id="output">L'IA est en cours de préparation...</div>
        <div id="status-bar" class="status">Statut : Prêt</div>
    </div>
    <script type="module" src="script.js"></script>
</body>
</html>
